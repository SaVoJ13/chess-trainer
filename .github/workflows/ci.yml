#
# CI за CONTRACTS 7.1. Фільтра `paths` немає навмисно: статус цього workflow
# може бути обов'язковим (Required) для `main`.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6
      # Збірка, unit-тести всіх модулів. Швидкий perft (тег JUnit `perft`)
      # додасть Шахове ядро, коли з'являться тести (CONTRACTS 7.1).
      - run: ./gradlew build

  # Debug-APK для прототипу на телефоні (запит Архітектора). Без фільтра paths.
  assemble-debug:
    name: Assemble debug APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew :app:assembleDebug
      - uses: actions/upload-artifact@v7
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  perft-deep:
    name: Deep perft (nightly)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6
      # Gradle-задачу для тегу `perft-deep` надасть Шахове ядро; поки тестів немає.
      - run: echo "Deep perft tests are not added yet (owner - Chess core)"
