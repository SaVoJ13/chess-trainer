#
# CI за CONTRACTS 7.1. Фільтра `paths` немає навмисно: статус цього workflow
# може бути обов'язковим (Required) для `main`.
#
# Кожен job явно встановлює Android SDK Platform 37, NDK і CMake через sdkmanager
# (SW-017), щоб збірка не залежала від складу образу раннера. Ліцензії SDK на
# раннері прийнято в образі. Мережу NNUE (98 МБ, SW-008) кешує actions/cache:
# завдання `fetchNnue*` перевіряє SHA-256 і при хибному кеші завантажує файл знову.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - name: Install Android SDK components
        run: >
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install
          "platforms;android-37.0" "ndk;30.0.16248370" "cmake;4.1.2"
      - name: Verify android.jar integrity
        run: unzip -tq "$ANDROID_HOME/platforms/android-37.0/android.jar"
      - uses: actions/cache@v6
        with:
          path: .nnue-cache
          key: nnue-${{ hashFiles('core-chess/engine-android/build.gradle.kts') }}
      - uses: gradle/actions/setup-gradle@v6
      # Збірка, unit-тести всіх модулів, швидкий perft (CONTRACTS 7.1).
      - run: ./gradlew build
      # Звіт ліцензій актуальний (CONTRACTS 7.1, v0.11). Те саме завдання, яким звіт генерують локально:
      # варіант Release (звіт описує releaseRuntimeClasspath), завдання без суфікса неоднозначне.
      # Експорт відтворюваний: два запуски дають побайтно однаковий файл, мережа не потрібна (offlineMode).
      - name: Regenerate license report
        run: ./gradlew :app:exportLibraryDefinitionsRelease
      - name: Check that the license report is up to date
        run: |
          if ! git diff --exit-code -- app/licenses/aboutlibraries.json; then
            echo "::error file=app/licenses/aboutlibraries.json::License report is out of date. Run './gradlew :app:exportLibraryDefinitionsRelease' and commit app/licenses/aboutlibraries.json."
            exit 1
          fi

  # Debug-APK для прототипу на телефоні (запит Архітектора). Без фільтра paths.
  assemble-debug:
    name: Assemble debug APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - name: Install Android SDK components
        run: >
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install
          "platforms;android-37.0" "ndk;30.0.16248370" "cmake;4.1.2"
      - name: Verify android.jar integrity
        run: unzip -tq "$ANDROID_HOME/platforms/android-37.0/android.jar"
      - uses: actions/cache@v6
        with:
          path: .nnue-cache
          key: nnue-${{ hashFiles('core-chess/engine-android/build.gradle.kts') }}
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew :app:assembleDebug
      # Статична перевірка байткоду на API вище minSdk 26 (CONTRACTS 7.2). Потрібні JDK 17+, ANDROID_HOME
      # (platforms/android-*/data/api-versions.xml, build-tools/*/dexdump); без залежностей.
      # Код виходу 1 (є порушення) або 2 (помилка запуску) валить збірку.
      - name: Check bytecode compatibility with minSdk
        run: java scripts/ApiCompatCheck.java --apk app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v7
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  perft-deep:
    name: Deep perft (nightly)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - name: Install Android SDK components
        run: >
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install
          "platforms;android-37.0" "ndk;30.0.16248370" "cmake;4.1.2"
      - name: Verify android.jar integrity
        run: unzip -tq "$ANDROID_HOME/platforms/android-37.0/android.jar"
      - uses: gradle/actions/setup-gradle@v6
      # Глибокий perft: JUnit Category PerftDeep (CONTRACTS 7.1).
      - run: ./gradlew :core-chess:api:perftDeep
